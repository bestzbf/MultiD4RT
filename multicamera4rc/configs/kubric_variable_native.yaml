# Standalone variable-layout example. Full mixed 50k training uses audited
# per-stage manifests generated by scripts/build_variable_curriculum.py.
image_mode: native
supervision: dense
num_times: 16
num_queries: 0
sampling: balanced_coverage
epoch_size: 100000
seed: 49
include_visibility: true
sources:
  - name: kubric_variable
    adapter: kubric_multicam
    root: /data8/kubric_multicam_tracking_v3
    split: train
    cameras: 10
    weight: 1.0
    strides: [1, 2, 4]
    layouts:
      - {cameras: 1, num_times: 8, weight: 1}
      - {cameras: 1, num_times: 16, weight: 1}
      - {cameras: 2, num_times: 12, weight: 1}
      - {cameras: 3, num_times: 8, weight: 1}
      - {cameras: 4, num_times: 6, weight: 1}
      - {cameras: 5, num_times: 4, weight: 1}
      - {cameras: 6, num_times: 4, weight: 1}
      - {cameras: 7, num_times: 4, weight: 1}
      - {cameras: 8, num_times: 4, weight: 1}
      - {cameras: 9, num_times: 4, weight: 1}
      - {cameras: 10, num_times: 4, weight: 1}
    options:
      cache_dir: ../../../.cache/multicamera4rc/kubric
      index_workers: 8
      required_schema_version: movi_tracking_v3
      require_native_tracks: true
      require_depth: true
      require_validation_stamp: true
      validation_stamp_dir: /data8/kubric_multicam_tracking_v3_state/validated
      min_validation_revision: 4
      split_strategy: variant_balanced
      val_ratio: 0.05
      random_cameras: true
      depth_is_ray_distance: true
      extrinsics_are_opengl: false
      verbose: false
