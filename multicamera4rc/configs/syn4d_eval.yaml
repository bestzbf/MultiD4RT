# Fixed C2T4 layouts for an immutable validation plan.
image_mode: native
supervision: dense
num_queries: 0
num_times: 4
include_visibility: true
epoch_size: 100
sources:
  - adapter: syn4d
    name: syn4d_v1
    root: /path/to/Syn4D
    split: train
    cameras: 2
    options: {subsets: [syn4d_v1_stride_5], frame_policy: reference, missing_mesh: mask}
  - adapter: syn4d
    name: syn4d_sim
    root: /path/to/Syn4D
    split: train
    cameras: 2
    options: {subsets: [syn4d_sim], frame_policy: reference, missing_mesh: mask}
