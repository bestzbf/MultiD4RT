[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multid4rt"
version = "0.5.0"
description = "MultiD4RT: multi-camera 4D reconstruction and tracking from synchronized RGB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5,<3",
    "numpy>=1.24,<3",
    "einops>=0.7",
    "addict>=2.4",
    "Pillow>=10",
]

[project.urls]
Repository = "https://github.com/bestzbf/MultiD4RT"
Documentation = "https://github.com/bestzbf/MultiD4RT/tree/main/docs"
Issues = "https://github.com/bestzbf/MultiD4RT/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
weights = ["safetensors>=0.4", "huggingface-hub>=0.25"]
viz = ["plotly>=5.24,<7", "opencv-python-headless>=4.9,<5"]

[project.scripts]
multid4rt = "multid4rt.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["multid4rt*"]

[tool.setuptools.package-data]
multid4rt = ["README.md", "assets/*.html"]
"multid4rt.vendor" = ["LICENSE*", "NOTICE", "UPSTREAM.json"]
